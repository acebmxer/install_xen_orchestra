name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on main script
        run: shellcheck -S warning install-xen-orchestra.sh

  unit-tests:
    name: BATS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install bats-core and test tools
        # genisoimage is what tpl_build_prep_drive uses to build the cloud-init
        # drive. The unit job runs on the runner rather than in one of the
        # integration images, all of which install an ISO writer, so without it
        # here the drive-building tests fail on a missing binary rather than on
        # anything the script got wrong.
        #
        # python3 parses the JSON the API build path sends to XO, and
        # openssh-client provides the ssh-keygen that builds each template's
        # throwaway key. Both sets of tests skip when their tool is absent
        # rather than failing, which is worse than a failure: the escaping of a
        # 60-line cloud-init document inside a JSON string, and the per-template
        # key regression, would go unchecked and the run would still be green.
        run: sudo apt-get install -y bats genisoimage python3 openssh-client openssl

      - name: Run unit tests
        run: bats tests/unit/

  integration:
    name: Integration (${{ matrix.label || matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            dockerfile: tests/integration/Dockerfile.debian12
          # DEPRECATED: free security maintenance for Ubuntu 22.04 ends on
          # 2027-04-30. Support is removed from this project on 2027-06-01 —
          # delete this matrix entry and
          # tests/integration/Dockerfile.ubuntu2204 on that date.
          - distro: ubuntu2204
            dockerfile: tests/integration/Dockerfile.ubuntu2204
            label: ubuntu2204 (deprecated, removed 2027-06-01)
          - distro: ubuntu2404
            dockerfile: tests/integration/Dockerfile.ubuntu2404
          - distro: ubuntu2604
            dockerfile: tests/integration/Dockerfile.ubuntu2604
          - distro: rockylinux9
            dockerfile: tests/integration/Dockerfile.rockylinux9
          - distro: fedora
            dockerfile: tests/integration/Dockerfile.fedora
          # DEPRECATED: Debian 11 (Bullseye) left Debian LTS on 2026-08-31.
          # Support is removed from this project on 2026-10-01 — delete this
          # matrix entry and tests/integration/Dockerfile.debian11 on that date.
          - distro: debian11
            dockerfile: tests/integration/Dockerfile.debian11
            label: debian11 (deprecated, removed 2026-10-01)
          - distro: debian13
            dockerfile: tests/integration/Dockerfile.debian13
          - distro: almalinux9
            dockerfile: tests/integration/Dockerfile.almalinux9
          - distro: centosstream9
            dockerfile: tests/integration/Dockerfile.centosstream9
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build integration image (${{ matrix.distro }})
        run: docker build -f ${{ matrix.dockerfile }} -t xo-test-${{ matrix.distro }} .

      - name: Run integration tests (${{ matrix.distro }})
        run: docker run --rm xo-test-${{ matrix.distro }}
