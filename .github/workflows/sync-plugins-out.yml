name: Sync plugins out

# Pushes plugins/<name>/ changes to the standalone xo-plugins repo whenever
# they land on main or dev here, via the same plugin-push.sh a human would
# otherwise have to remember to run by hand.

on:
  push:
    branches: ["main", "dev"]
    paths: ["plugins/**"]

permissions:
  contents: read

jobs:
  push-plugins:
    name: Push changed plugins to xo-plugins
    runs-on: ubuntu-latest
    # Job-level so it's also present when "Push each changed plugin" invokes
    # git push -- gh's credential helper reads the token from this env var at
    # the moment git calls it, it doesn't need a prior `gh auth login`.
    env:
      GH_TOKEN: ${{ secrets.XO_PLUGINS_SYNC_TOKEN }}
    steps:
      - name: Checkout
        # Pinned to a commit SHA: a tag can be retargeted, a SHA cannot.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Attach to the pushed branch
        # actions/checkout leaves HEAD detached. plugin-push.sh refuses to run
        # unless `git rev-parse --abbrev-ref HEAD` reports "main" or "dev".
        run: git checkout -B "${{ github.ref_name }}"

      - name: Authenticate git for the xo-plugins push
        # gh's own credential helper, not a token embedded in the remote URL --
        # that would risk the token appearing in a printed command or error.
        # No `gh auth login` here: with GH_TOKEN already in env, current gh
        # refuses `auth login --with-token` outright ("the value of the
        # GH_TOKEN environment variable is being used for authentication...
        # clear it first"). `gh auth setup-git` alone is sufficient -- it
        # just wires up the credential helper, which reads GH_TOKEN from env
        # at push time.
        run: gh auth setup-git

      - name: Push each changed plugin
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            # New branch: nothing to diff against, so treat every existing
            # plugin folder as changed rather than pushing nothing.
            changed=$(find plugins -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          else
            changed=$(git diff --name-only "$before" "${{ github.event.after }}" -- plugins/ | cut -d/ -f2 | sort -u)
          fi

          if [ -z "$changed" ]; then
            echo "No plugin folders changed."
            exit 0
          fi

          for plugin in $changed; do
            if [ -d "plugins/$plugin" ]; then
              echo "::group::Pushing $plugin"
              scripts/plugin-push.sh "$plugin"
              echo "::endgroup::"
            fi
          done
