name: Sync dev

# After a pull request is merged into main, GitHub's merge commit exists only on
# main, leaving dev "behind". This fast-forwards dev back to main so the next
# pull request contains only real work.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  fast-forward:
    name: Fast-forward dev to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fast-forward dev
        run: |
          set -euo pipefail

          if ! git show-ref --quiet refs/remotes/origin/dev; then
            echo "No dev branch on origin — nothing to do."
            exit 0
          fi

          ahead=$(git rev-list --count origin/main..origin/dev)
          behind=$(git rev-list --count origin/dev..origin/main)

          if [ "$ahead" -gt 0 ]; then
            echo "dev has $ahead commit(s) main does not — refusing to move it."
            echo "Merge dev into main first, then re-run this workflow."
            exit 0
          fi

          if [ "$behind" -eq 0 ]; then
            echo "dev is already level with main."
            exit 0
          fi

          echo "Fast-forwarding dev by $behind commit(s)."
          git push origin "origin/main:refs/heads/dev"
